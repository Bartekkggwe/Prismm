
name: PRYZMAT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PRYZMAT-Android-source.zip'
      - '.github/workflows/apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sprawdz Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Skonfiguruj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rozpakuj projekt
        run: |
          unzip -q PRYZMAT-Android-source.zip
          ls -la PRYZMAT-Android

      - name: Zbuduj APK
        working-directory: PRYZMAT-Android
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Przygotuj APK
        run: |
          cp PRYZMAT-Android/app/build/outputs/apk/debug/app-debug.apk PRYZMAT.apk

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: PRYZMAT-APK
          path: PRYZMAT.apk
          if-no-files-found: error
          retention-days: 30
          
