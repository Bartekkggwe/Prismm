
name: PRYZMAT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PRYZMAT-Android-source.zip'
      - '.github/workflows/apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rozpakuj projekt
        run: unzip -q PRYZMAT-Android-source.zip

      - name: Zbuduj APK
        working-directory: PRYZMAT-Android
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PRYZMAT-APK
          path: PRYZMAT-Android/app/build/outputs/apk/debug/app-debug.apk
          
